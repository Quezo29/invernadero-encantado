  <text x="424" y="368" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#212121">Fecha</text>
  <rect x="424" y="376" width="432" height="48" rx="8" fill="#FFFFFF" stroke="#9E9E9E"/>
  <text x="436" y="406" font-family="system-ui, sans-serif" font-size="16" fill="#212121">18 nov 2026</text>
