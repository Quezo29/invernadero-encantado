  <!-- Página de fondo -->
  <rect x="0" y="32" width="1280" height="688" fill="#F2F2F2"/>
  <text x="160" y="64" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121">Invernadero Encantado</text>
  <line x1="0" y1="84" x2="1280" y2="84" stroke="#D9D9D9"/>
  <rect x="160" y="120" width="960" height="240" rx="12" fill="#FFFFFF" stroke="#D9D9D9"/>
  <rect x="160" y="120" width="960" height="48" fill="#F2F2F2"/>
  <line x1="160" y1="168" x2="1120" y2="168" stroke="#D9D9D9"/>
