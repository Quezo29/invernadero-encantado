  <line x1="160" y1="296" x2="1120" y2="296" stroke="#D9D9D9"/>

  <!-- Diálogo -->
  <rect x="400" y="140" width="480" height="480" rx="12" fill="#FFFFFF" stroke="#D9D9D9"/>

  <text x="424" y="188" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#212121">Registrar un riego</text>
  <text x="424" y="216" font-family="system-ui, sans-serif" font-size="16" fill="#616161">Mandrágora · Mesa 2</text>

