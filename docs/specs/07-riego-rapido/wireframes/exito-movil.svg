<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 872" width="390" height="872" role="img" aria-label="Wireframe móvil de la lista con el mensaje de éxito tras guardar el riego">
  <title>Éxito · CA-1.8.4</title>

  <!-- Banda de anotación -->
  <rect width="390" height="32" fill="#F2F2F2"/>
  <text x="12" y="21" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Éxito · CA-1.8.4</text>

  <!-- Cabecera de la app -->
  <text x="16" y="64" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121">Invernadero Encantado</text>
  <line x1="0" y1="84" x2="390" y2="84" stroke="#D9D9D9"/>
  <text x="16" y="124" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#212121">Plantas</text>

  <!-- Mensaje de éxito -->
  <rect x="16" y="140" width="358" height="56" rx="12" fill="#F2F2F2" stroke="#9E9E9E"/>
  <rect x="28" y="159" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#616161" stroke-width="2"/>
  <path d="M32 168 l4 4 l7 -8" fill="none" stroke="#616161" stroke-width="2"/>
  <text x="56" y="174" font-family="system-ui, sans-serif" font-size="16" fill="#212121">Riego guardado para Mandrágora.</text>

  <!-- Fila 1 -->
  <rect x="16" y="208" width="358" height="180" rx="12" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="32" y="240" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#212121">Mandrágora</text>
  <text x="32" y="268" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Especie: Mandragora officinarum</text>
  <text x="32" y="290" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Ubicación: Mesa 2</text>
  <text x="32" y="312" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Riego cada: 3 días</text>
  <rect x="262" y="332" width="96" height="44" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="2"/>
  <text x="310" y="360" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#616161" text-anchor="middle">Regar</text>

  <!-- Fila 2 -->
  <rect x="16" y="400" width="358" height="180" rx="12" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="32" y="432" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#212121">Helecho Lunar</text>
  <text x="32" y="460" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Especie: Nephrolepis exaltata</text>
  <text x="32" y="482" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Ubicación: Mesa 1</text>
  <text x="32" y="504" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Riego cada: 2 días</text>
  <rect x="262" y="524" width="96" height="44" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="2"/>
  <text x="310" y="552" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#616161" text-anchor="middle">Regar</text>

  <!-- Formulario de la pantalla (sin cambios) -->
  <text x="16" y="624" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#212121">Registrar una planta</text>
  <text x="16" y="660" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#212121">Nombre</text>
  <rect x="16" y="668" width="358" height="44" rx="8" fill="#FFFFFF" stroke="#9E9E9E"/>
  <text x="16" y="732" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#212121">Especie</text>
  <rect x="16" y="740" width="358" height="44" rx="8" fill="#FFFFFF" stroke="#9E9E9E"/>
  <rect x="16" y="804" width="200" height="48" rx="8" fill="#616161"/>
  <text x="116" y="834" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Registrar planta</text>
</svg>
