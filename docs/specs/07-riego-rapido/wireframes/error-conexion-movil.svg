<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 824" width="390" height="824" role="img" aria-label="Wireframe móvil del panel con el mensaje de error de conexión encima de los campos">
  <title>Error de conexión · CA-1.8.6</title>

  <!-- Banda de anotación -->
  <rect width="390" height="32" fill="#F2F2F2"/>
  <text x="12" y="21" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Error de conexión · CA-1.8.6</text>

  <!-- Cabecera y lista al fondo -->
  <text x="16" y="64" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121">Invernadero Encantado</text>
  <line x1="0" y1="84" x2="390" y2="84" stroke="#D9D9D9"/>
  <text x="16" y="124" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#212121">Plantas</text>
  <rect x="16" y="144" width="358" height="180" rx="12" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="32" y="176" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#212121">Mandrágora</text>

  <!-- Panel (hoja inferior) -->
  <rect x="0" y="260" width="390" height="564" rx="12" fill="#FFFFFF" stroke="#D9D9D9"/>
  <rect x="175" y="272" width="40" height="4" rx="2" fill="#D9D9D9"/>

  <text x="16" y="316" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#212121">Registrar un riego</text>
  <text x="16" y="344" font-family="system-ui, sans-serif" font-size="16" fill="#616161">Mandrágora · Mesa 2</text>

  <!-- Mensaje de error de conexión -->
  <rect x="16" y="360" width="358" height="96" rx="12" fill="#F2F2F2" stroke="#212121"/>
  <rect x="28" y="378" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#212121" stroke-width="2"/>
  <text x="52" y="391" font-family="system-ui, sans-serif" font-size="14" fill="#212121">No pudimos guardar el riego.</text>
  <text x="52" y="413" font-family="system-ui, sans-serif" font-size="14" fill="#212121">Revisa que la API esté encendida</text>
  <text x="52" y="435" font-family="system-ui, sans-serif" font-size="14" fill="#212121">y vuelve a intentarlo.</text>

  <text x="16" y="492" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#212121">Cantidad (ml)</text>
  <rect x="16" y="500" width="358" height="48" rx="8" fill="#FFFFFF" stroke="#9E9E9E"/>
  <text x="28" y="530" font-family="system-ui, sans-serif" font-size="16" fill="#212121">500</text>
  <text x="16" y="570" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Medio litro son 500 ml.</text>

  <text x="16" y="604" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#212121">Fecha</text>
  <rect x="16" y="612" width="358" height="48" rx="8" fill="#FFFFFF" stroke="#9E9E9E"/>
  <text x="28" y="642" font-family="system-ui, sans-serif" font-size="16" fill="#212121">18 nov 2026</text>
  <text x="16" y="680" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Déjala como está si la regaste hoy.</text>

  <rect x="16" y="708" width="358" height="48" rx="8" fill="#616161"/>
  <text x="195" y="738" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Guardar riego</text>
  <rect x="16" y="764" width="358" height="44" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="2"/>
  <text x="195" y="792" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#616161" text-anchor="middle">Cancelar</text>
</svg>
