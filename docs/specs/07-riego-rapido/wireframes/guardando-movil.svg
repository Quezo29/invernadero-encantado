<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 728" width="390" height="728" role="img" aria-label="Wireframe móvil del panel mientras guarda el riego, con el botón desactivado">
  <title>Guardando · CA-1.8.3</title>

  <!-- Banda de anotación -->
  <rect width="390" height="32" fill="#F2F2F2"/>
  <text x="12" y="21" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Guardando · CA-1.8.3</text>

  <!-- Cabecera y lista al fondo -->
  <text x="16" y="64" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121">Invernadero Encantado</text>
  <line x1="0" y1="84" x2="390" y2="84" stroke="#D9D9D9"/>
  <text x="16" y="124" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#212121">Plantas</text>
  <rect x="16" y="144" width="358" height="180" rx="12" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="32" y="176" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#212121">Mandrágora</text>

  <!-- Panel (hoja inferior) -->
  <rect x="0" y="260" width="390" height="468" rx="12" fill="#FFFFFF" stroke="#D9D9D9"/>
  <rect x="175" y="272" width="40" height="4" rx="2" fill="#D9D9D9"/>

  <text x="16" y="316" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#212121">Registrar un riego</text>
  <text x="16" y="344" font-family="system-ui, sans-serif" font-size="16" fill="#616161">Mandrágora · Mesa 2</text>

  <text x="16" y="384" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#9E9E9E">Cantidad (ml)</text>
  <rect x="16" y="392" width="358" height="48" rx="8" fill="#F2F2F2" stroke="#D9D9D9"/>
  <text x="28" y="422" font-family="system-ui, sans-serif" font-size="16" fill="#9E9E9E">500</text>
  <text x="16" y="462" font-family="system-ui, sans-serif" font-size="14" fill="#9E9E9E">Medio litro son 500 ml.</text>

  <text x="16" y="496" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#9E9E9E">Fecha</text>
  <rect x="16" y="504" width="358" height="48" rx="8" fill="#F2F2F2" stroke="#D9D9D9"/>
  <text x="28" y="534" font-family="system-ui, sans-serif" font-size="16" fill="#9E9E9E">18 nov 2026</text>
  <text x="16" y="574" font-family="system-ui, sans-serif" font-size="14" fill="#9E9E9E">Déjala como está si la regaste hoy.</text>

  <rect x="16" y="600" width="358" height="48" rx="8" fill="#9E9E9E"/>
  <text x="195" y="630" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Guardando…</text>
  <rect x="16" y="660" width="358" height="48" rx="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="2"/>
  <text x="195" y="690" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#9E9E9E" text-anchor="middle">Cancelar</text>
</svg>
