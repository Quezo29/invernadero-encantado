  <rect x="160" y="568" width="200" height="48" rx="8" fill="#616161"/>
  <text x="260" y="598" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Registrar planta</text>
