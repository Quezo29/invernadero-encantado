  <text x="676" y="306" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Mesa 1</text>
  <text x="856" y="306" font-family="system-ui, sans-serif" font-size="14" fill="#616161">2 días</text>
  <rect x="996" y="278" width="108" height="44" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="2"/>
