<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" role="img" aria-label="Wireframe de escritorio de la lista de plantas con una columna de acción Regar">
  <title>Lista · CA-1.8.1</title>

  <!-- Banda de anotación -->
