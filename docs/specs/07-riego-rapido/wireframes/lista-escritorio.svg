  <line x1="0" y1="84" x2="1280" y2="84" stroke="#D9D9D9"/>

  <!-- Título -->
  <text x="160" y="132" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#212121">Plantas</text>

